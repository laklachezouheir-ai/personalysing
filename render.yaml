services:
  - type: web
    name: personalysing
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Chaîne de connexion PostgreSQL (Neon, Supabase...) — voir README.md
      # "Base de données". Absente = repli sur fichier JSON local, à éviter
      # en production (disque non persistant sur le plan gratuit).
      - key: DATABASE_URL
        sync: false
      # Stockage objet S3-compatible (ex : Cloudflare R2) pour les fichiers
      # (photos, aperçus, mockups, vidéos) — voir README.md "Stockage des
      # fichiers". Absent = repli sur disque local, à éviter en production.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: ETSY_API_KEY
        sync: false
      - key: ETSY_SHARED_SECRET
        sync: false
      - key: ETSY_REDIRECT_URI
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: RUNWAY_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
