services:
  - type: web
    name: personalysing
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Chaîne de connexion PostgreSQL (Neon, Supabase...) — voir README.md
      # "Base de données". Absente = repli sur fichier JSON local, à éviter
      # en production (disque non persistant sur le plan gratuit).
      - key: DATABASE_URL
        sync: false
      - key: ETSY_API_KEY
        sync: false
      - key: ETSY_SHARED_SECRET
        sync: false
      - key: ETSY_REDIRECT_URI
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: RUNWAY_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
